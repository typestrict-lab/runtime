[package]
name = "typestrict-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Serves a typestrict.ai model on CPU over HTTP, with Jev's decision API (POST /v1/systemone)."
repository = "https://github.com/typestrict-lab/runtime"
readme = "README.md"

[dependencies]
anyhow = "=1.0.104"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-native"] }
serde = { version = "=1.0.229", features = ["derive"] }
# No `preserve_order`: serde_json's Map must sort keys, which is what render() (Python's sort_keys=True) relies on.
# The request keeps the order of `questions` and `criteria` with its own deserializers (contract.rs).
serde_json = "=1.0.151"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "signal"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
