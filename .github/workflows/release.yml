name: Release
# On a v* tag: build the image natively on each architecture, smoke-test it with the test model, push it by digest,
# then join the digests into one multi-arch tag: ghcr.io/typestrict-lab/runtime:<version>, :<major>.<minor> and :latest.
on:
  push:
    # Full versions only.
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/typestrict-lab/runtime

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $version"
            exit 1
          fi

  # No QEMU: compiling under emulation takes an hour. Each platform builds on its own runner.
  docker:
    needs: check
    name: docker ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, os: ubuntu-24.04 }
          - { platform: linux/arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: typestrict-runtime:smoke
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Cache the test model
        uses: actions/cache@v4
        with:
          path: test-model
          key: test-model-${{ hashFiles('scripts/fetch-test-model.sh') }}
      - name: Smoke test with the test model
        run: |
          scripts/fetch-test-model.sh
          scripts/smoke.sh typestrict-runtime:smoke test-model
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.os }}
          path: digests/*
          if-no-files-found: error

  docker-manifest:
    needs: docker
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag the multi-arch image
        working-directory: digests
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags=(-t "$IMAGE:$version" -t "$IMAGE:${version%.*}")
          # Pre-releases (v0.2.0-rc.1) never move latest.
          [[ "$version" != *-* ]] && tags+=(-t "$IMAGE:latest")
          # shellcheck disable=SC2046 # one argument per digest
          docker buildx imagetools create "${tags[@]}" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$version"
